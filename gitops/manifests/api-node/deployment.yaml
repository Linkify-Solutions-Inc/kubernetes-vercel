apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-node
  namespace: app-api-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-node
  template:
    metadata:
      labels:
        app: api-node
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api-node
          # __ECR_IMAGE__ is replaced by the CI pipeline (image line, gitops commit).
          image: 242626138899.dkr.ecr.us-east-1.amazonaws.com/mini-paas/api-node:ac5601d6e6e20265c60083e529455a09402e90de
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
