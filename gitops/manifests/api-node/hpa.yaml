# Pod-level autoscaling (REQ-3.7-1). 50% of the 50m CPU REQUEST — a modest load
# spike crosses the threshold quickly, so the demo fires with light effort.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-node
  namespace: app-api-node
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-node
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
