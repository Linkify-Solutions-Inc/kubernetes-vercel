# Background/queue worker. WORK_PER_TICK_MS controls how much CPU it burns each
# second (200ms ≈ 20% of a core — under the 50% HPA target by default). Raise it
# to drive the worker's HPA, per the exercise playbook.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-node
  namespace: app-worker-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-node
  template:
    metadata:
      labels:
        app: worker-node
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker-node
          image: 242626138899.dkr.ecr.us-east-1.amazonaws.com/mini-paas/worker-node:05a39963f34d461523fa15b497ac14ef378f349a
          env:
            - name: WORK_PER_TICK_MS
              value: "200"
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
