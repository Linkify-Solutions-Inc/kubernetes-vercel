apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worker-node
  namespace: app-worker-node
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: mini-paas
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - host: worker.__INGRESS_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worker-node
                port:
                  name: http
