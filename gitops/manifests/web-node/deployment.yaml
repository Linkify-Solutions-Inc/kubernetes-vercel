# Static site — deliberately no HPA (REQ-3.5-1 "web" demo). Fixed at 1 replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-node
  namespace: app-web-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-node
  template:
    metadata:
      labels:
        app: web-node
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web-node
          image: __ECR_IMAGE__
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
