apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: py-api
  namespace: app-py-api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: mini-paas
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - host: py.mini-paas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: py-api
                port:
                  name: http
