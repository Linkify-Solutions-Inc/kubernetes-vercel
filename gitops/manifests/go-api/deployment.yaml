apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: app-go-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: go-api
          image: 242626138899.dkr.ecr.us-east-1.amazonaws.com/mini-paas/go-api:13b447137f88329c0525c8af3165270ae647ee6d
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
